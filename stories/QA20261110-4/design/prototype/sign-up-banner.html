<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-up banner — Static sign-up banner</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { justify-content: flex-start; }
    .page { width: 100%; max-width: var(--banner-width); flex: 1; display: flex; align-items: center; }
    .banner {
      width: 100%;
      display: flex;
      align-items: center;
      gap: var(--space-2xl);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-primary);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--space-xl) var(--space-2xl);
    }
    .banner h1 { flex: 1 1 0; margin: 0; font-size: var(--font-size-xl); }
    .banner-action { flex: 1 1 0; display: flex; gap: var(--space-sm); }
    .banner-action input { flex: 1; }
    .banner-action .btn-primary { flex-shrink: 0; }
  </style>
</head>
<body>

  <nav class="proto-nav" aria-label="Prototype navigation">
    <a href="index.html">← Back to index</a>
    <span class="current">Sign-up banner</span>
  </nav>

  <main class="page">
    <section class="banner" aria-labelledby="banner-title">
      <h1 id="banner-title">Get product updates in your inbox</h1>
      <div class="banner-action">
        <input type="email" placeholder="name@example.com" aria-label="Email address" autocomplete="off">
        <button type="button" class="btn-primary">Sign up</button>
      </div>
    </section>
  </main>

</body>
</html>
