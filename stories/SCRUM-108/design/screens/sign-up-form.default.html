<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-up form</title>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z" fill="none" stroke="#9a3b26" stroke-width="2"/><path d="M8 9h8M8 13h6" stroke="#9a3b26" stroke-width="2" stroke-linecap="round"/></svg>
      The Guestbook
    </a>
  </header>
  <main class="page">
    <form class="card" aria-labelledby="title" novalidate>
      <h1 id="title">Get the guestbook newsletter</h1>
      <p class="lead">Occasional news from the guestbook, straight to your inbox. Just your name and email.</p>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>
      <div class="check-field">
        <input id="digest" name="digest" type="checkbox">
        <label for="digest">Also send me the monthly digest</label>
      </div>
      <a class="button" href="sign-up-form.error.html">Join the newsletter</a>
      <a class="back" href="index.html">← Back to the guestbook</a>
    </form>
  </main>
  <footer class="footer">You can unsubscribe from any newsletter email.</footer>
</body>
</html>
