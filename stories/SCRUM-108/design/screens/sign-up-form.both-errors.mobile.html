<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Sign-up form</title>
<link rel="stylesheet" href="tokens.css">
</head>
<body class="mobile">
  <header class="topbar">
    <a class="brand" href="index.html">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z" fill="none" stroke="#9a3b26" stroke-width="2"/><path d="M8 9h8M8 13h6" stroke="#9a3b26" stroke-width="2" stroke-linecap="round"/></svg>
      The Guestbook
    </a>
  </header>
  <main class="page">
    <section class="card" aria-labelledby="title">
      <h1 id="title">Get the guestbook newsletter</h1>
      <p class="lead">Occasional news from the guestbook, straight to your inbox. Just your name and email.</p>
      <div class="field invalid">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" value="" placeholder="e.g. Dana Levi" class="is-focused" autofocus aria-invalid="true" aria-describedby="name-error">
        <p class="field-error" id="name-error"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.5v4.2M8 11.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Please enter your name</p>
      </div>
      <div class="field invalid">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" value="dana.levi.example.com" aria-invalid="true" aria-describedby="email-error">
        <p class="field-error" id="email-error"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.5v4.2M8 11.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Please enter a valid email</p>
      </div>
      <div class="check-field">
        <input id="digest" name="digest" type="checkbox" checked>
        <label for="digest">Also send me the monthly digest</label>
      </div>
      <a class="button" href="sign-up-form.loading.mobile.html">Join the newsletter</a>
      <a class="back" href="index.html">← Back to the guestbook</a>
    </section>
  </main>
  <footer class="footer">You can unsubscribe from any newsletter email.</footer>
</body>
</html>
