<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-up form — Loading (Mobile) — Newsletter sign-up</title>
<link rel="stylesheet" href="tokens.css">
</head>
<body class="mobile">
<div class="review-bar">
  <span>Sign-up form · Loading · Mobile</span>
  <span class="links"><span>Answer:</span><a href="confirmation.default.mobile.html">success</a><a href="sign-up-form.submission-failed.mobile.html">failure</a><a href="sign-up-form.loading.html">Desktop version</a><a href="index.html">Gallery</a></span>
</div>
<header class="site-header">
  <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#2f5bd3" stroke-width="3"/></svg>
  Halo
</header>
<main class="page">
  <ol class="steps" aria-label="Progress">
    <li class="done">1 · Welcome</li>
    <li class="current" aria-current="step">2 · Your details</li>
    <li>3 · Check your inbox</li>
  </ol>
  <div class="card">
    <h1>Sign up for the newsletter</h1>
    <p class="muted">We only need your email address.</p>

    <div class="field">
      <label for="email">Email address</label>
      <input class="input" id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" value="dana.levi@example.com" readonly>
    </div>

    <div class="check-group">
      <label class="check" for="consent">
        <input id="consent" type="checkbox" checked disabled>
        <span>Send me the product newsletter. I can unsubscribe at any time.</span>
      </label>
    </div>

    <div class="actions">
      <span class="btn btn-block" role="button" aria-disabled="true" aria-live="polite"><svg class="spinner" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5"/><path d="M9 2 A7 7 0 0 1 16 9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></svg>Subscribing…</span>
    </div>
  </div>
  <p class="small below"><a class="link-back" href="welcome.default.mobile.html">← Back</a></p>
</main>
</body>
</html>
