<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=375, initial-scale=1">
  <title>Confirmation (default, mobile) — Newsletter sign-up</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { padding: var(--space-md) var(--space-sm); }
    .card { padding: var(--space-xl) var(--space-lg); max-width: 100%; }
    h1 { font-size: var(--font-size-xl); }
  </style>
</head>
<body>

  <div class="card">

    <div class="step-indicator">
      <div class="step active"></div>
      <div class="step active"></div>
      <div class="step active"></div>
    </div>

    <div class="check-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M20 6L9 17L4 12" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Check your inbox</h1>

    <p>
      We sent a confirmation email to
      <span class="email-address">alex.morgan@example.com</span>.
      Click the link in that email to complete your sign-up. If you don't
      see it within a few minutes, check your spam folder.
    </p>

    <a href="welcome-default-mobile.html" class="btn-primary">Back to site</a>

    <a href="index.html" class="back-link">Gallery</a>

  </div>

</body>
</html>
