<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the Friday Dispatch — The Harbour Gazette</title>
  <link rel="stylesheet" href="tokens.css">
</head>
<body class="mobile">
  <header class="site-header">
    <span class="site-title">The Harbour Gazette</span>
    <nav class="site-nav" aria-label="Site">
      <span>Stories</span>
      <span>Archive</span>
      <a href="welcome.default.mobile.html" aria-current="page">Subscribe</a>
    </nav>
  </header>
  <main class="page">
    <section>
      <h1>Join the Friday Dispatch</h1>
      <p class="intro">New releases from the harbour desk, at most once a month.</p>
      <div class="card">
        <label class="field-label" for="email">Your email</label>
        <input class="field" id="email" type="email" autocomplete="email" placeholder="you@example.com">
        <label class="consent" for="consent">
          <input id="consent" type="checkbox">
          <span>Send me the product newsletter. I can unsubscribe at any time.</span>
        </label>
        <div class="actions">
          <a class="button" href="sign-up-form.loading.mobile.html">Subscribe</a>
          <a class="back-link" href="welcome.default.mobile.html">Back</a>
        </div>
      </div>
    </section>
    <aside class="side">
      <h2>Past dispatches</h2>
      <ul>
        <li>The tide tables, explained</li>
        <li>Lighthouse keepers of the north</li>
        <li>A winter at the fish market</li>
      </ul>
    </aside>
  </main>
  <footer class="site-footer">The Harbour Gazette, est. 1911</footer>
</body>
</html>
