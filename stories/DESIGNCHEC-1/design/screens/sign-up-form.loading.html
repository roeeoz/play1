<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the Friday Dispatch — The Harbour Gazette</title>
  <link rel="stylesheet" href="tokens.css">
</head>
<body class="desktop">
  <header class="site-header">
    <span class="site-title">The Harbour Gazette</span>
    <nav class="site-nav" aria-label="Site">
      <span>Stories</span>
      <span>Archive</span>
      <a href="welcome.default.html" aria-current="page">Subscribe</a>
    </nav>
  </header>
  <main class="page">
    <section>
      <h1>Join the Friday Dispatch</h1>
      <p class="intro">New releases from the harbour desk, at most once a month.</p>
      <div class="card" aria-busy="true">
        <label class="field-label" for="email">Your email</label>
        <input class="field" id="email" type="email" autocomplete="email" value="maren.holt@example.com" readonly>
        <label class="consent consent--busy" for="consent">
          <input id="consent" type="checkbox" checked disabled>
          <span>Send me the product newsletter. I can unsubscribe at any time.</span>
        </label>
        <div class="actions">
          <span class="button" role="button" aria-disabled="true" aria-live="polite"><svg class="spinner" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-width="2.5"/><path d="M9 2a7 7 0 0 1 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>Subscribing…</span>
          <span class="back-link" aria-disabled="true">Back</span>
        </div>
      </div>
    </section>
    <aside class="side">
      <h2>Past dispatches</h2>
      <ul>
        <li>The tide tables, explained</li>
        <li>Lighthouse keepers of the north</li>
        <li>A winter at the fish market</li>
      </ul>
    </aside>
  </main>
  <footer class="site-footer">The Harbour Gazette, est. 1911</footer>
</body>
</html>
