<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=375, initial-scale=1">
  <title>Sign-up form — Submission failed (Mobile)</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    html {
      max-width: 375px;
      margin: 0 auto;
    }

    body {
      padding: var(--space-md);
      justify-content: flex-start;
      padding-top: var(--space-xl);
    }

    .card {
      padding: var(--space-xl);
      border: none;
      border-radius: 0;
    }

    .card h2 {
      font-size: var(--font-size-lg);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Sign up for the newsletter</h2>
    <p>Enter your email address and we will send you a confirmation.</p>

    <div class="error-banner">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="7" stroke="#DC2626" stroke-width="1.5"/>
        <path d="M8 4.5V8.5" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="8" cy="11" r="0.75" fill="#DC2626"/>
      </svg>
      <span>Something went wrong and your sign-up did not go through. Please try again.</span>
    </div>

    <div class="form-group">
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        value="alex.rivera@example.com"
        autocomplete="email"
      >
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="consent" checked>
      <label for="consent">
        Send me the product newsletter. I can unsubscribe at any time.
      </label>
    </div>

    <a href="confirmation-default-mobile.html" class="btn-primary">Subscribe</a>

    <a href="welcome-default-mobile.html" class="link-back">← Back</a>
  </div>

  <nav class="gallery-nav">
    <a href="index.html">← Back to gallery</a>
  </nav>

</body>
</html>
