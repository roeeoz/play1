<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-up form — Invalid email</title>
  <link rel="stylesheet" href="tokens.css">
</head>
<body>

  <div class="card">
    <h2>Sign up for the newsletter</h2>
    <p>Enter your email address and we will send you a confirmation.</p>

    <div class="form-group has-error">
      <label for="email">Email address</label>
      <input
        type="text"
        id="email"
        value="alex.rivera@"
        autocomplete="email"
      >
      <span class="field-error">Enter a valid email address.</span>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="consent" checked>
      <label for="consent">
        Send me the product newsletter. I can unsubscribe at any time.
      </label>
    </div>

    <a href="confirmation-default.html" class="btn-primary">Subscribe</a>

    <a href="welcome-default.html" class="link-back">← Back</a>
  </div>

  <nav class="gallery-nav">
    <a href="index.html">← Back to gallery</a>
  </nav>

</body>
</html>
