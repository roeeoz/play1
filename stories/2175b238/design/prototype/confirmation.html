<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmation — Newsletter sign-up</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    .confirmation-icon {
      margin-bottom: var(--space-lg);
    }

    .email-address {
      display: inline-block;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--space-sm) var(--space-md);
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: var(--space-lg);
      word-break: break-all;
    }

    .hint {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-xl);
    }

    .btn-secondary {
      display: inline-block;
      width: 100%;
      padding: var(--space-md) var(--space-lg);
      background: var(--color-bg);
      color: var(--color-primary);
      font-size: var(--font-size-base);
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      transition: background 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--color-surface);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="confirmation-icon">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="48" height="48" rx="12" fill="#F0FDF4"/>
        <path d="M18 24L22 28L30 20" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="24" cy="24" r="12" stroke="#16A34A" stroke-width="2"/>
      </svg>
    </div>

    <h2>Check your inbox</h2>
    <p>
      We sent a confirmation email to the address below.
      Click the link in that email to complete your subscription.
    </p>

    <span class="email-address">alex.rivera@example.com</span>

    <p class="hint">
      If you do not see the email within a few minutes, check your spam folder.
    </p>

    <a href="welcome.html" class="btn-secondary">Back to site</a>
  </div>

  <nav class="proto-nav">
    Prototype: <a href="index.html">Index</a> · <a href="welcome.html">Welcome</a> → <a href="sign-up-form.html">Sign-up form</a> → Confirmation
  </nav>

</body>
</html>
