[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testbed-utils"
version = "0.1.0"
description = "Tiny text/date utility library — fixture repo for deterministic Demerzel coding-phase testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["pypdf", "flask>=3"]

[project.scripts]
pdf-extract = "testbed_utils.pdfutils:main"
testbed-num-summary = "testbed_utils.numsummary:main"
testbed-hello = "testbed_utils.hello:main"
guestbook = "guestbook.app:main"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
