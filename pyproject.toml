[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testbed-utils"
version = "0.1.0"
description = "Tiny text/date utility library — fixture repo for deterministic Demerzel coding-phase testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pypdf",
    "flask>=3",
    "reportlab>=4",
    "arabic-reshaper>=3",
    "python-bidi>=0.4",
]

[project.scripts]
pdf-extract = "testbed_utils.pdfutils:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-flask"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
